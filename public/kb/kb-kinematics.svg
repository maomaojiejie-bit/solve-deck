<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" stroke="currentColor" stroke-width="1.6" font-family="'Noto Sans SC',sans-serif" font-size="15">
  <style>:root{color:#52606d}@media (prefers-color-scheme:dark){:root{color:#9fb0c0}}</style>
  <line x1="120" y1="280" x2="220" y2="280"/>
  <line x1="120" y1="280" x2="120" y2="180"/>
  <text x="224" y="286" font-size="13">x</text><text x="112" y="172" font-size="13">y</text>
  <text x="98" y="302" font-size="13">静系 O</text>
  <line x1="330" y1="230" x2="430" y2="230"/>
  <line x1="330" y1="230" x2="330" y2="130"/>
  <text x="434" y="236" font-size="13">x′</text><text x="322" y="122" font-size="13">y′</text>
  <text x="308" y="254" font-size="13">动系 O′</text>
  <circle cx="470" cy="120" r="5" fill="currentColor"/>
  <text x="480" y="116" font-size="13">P</text>
  <line x1="470" y1="120" x2="560" y2="90"/>
  <path d="M560 84 L572 90 L560 96 Z" fill="currentColor"/>
  <text x="540" y="80" font-size="13">va</text>
  <line x1="470" y1="120" x2="540" y2="150"/>
  <path d="M540 144 L552 150 L540 156 Z" fill="currentColor"/>
  <text x="520" y="170" font-size="13">ve</text>
  <line x1="470" y1="120" x2="490" y2="60"/>
  <path d="M484 60 L490 48 L496 60 Z" fill="currentColor"/>
  <text x="464" y="56" font-size="13">vr</text>
  <line x1="540" y1="150" x2="560" y2="90" stroke-dasharray="5 4"/>
  <line x1="490" y1="60" x2="560" y2="90" stroke-dasharray="5 4"/>
  <text x="60" y="330">va = ve + vr；牵连速度取动系上与动点重合那一点的速度</text>
</svg>