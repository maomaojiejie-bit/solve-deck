<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" stroke="currentColor" stroke-width="1.6" font-family="'Noto Sans SC',sans-serif" font-size="15">
  <style>:root{color:#52606d}@media (prefers-color-scheme:dark){:root{color:#9fb0c0}}</style>
  <rect x="55" y="120" width="150" height="100" rx="10"/>
  <text x="90" y="178">第一级 A1</text>
  <line x1="205" y1="170" x2="252" y2="170"/>
  <path d="M252 164 L264 170 L252 176 Z" fill="currentColor"/>
  <rect x="264" y="120" width="150" height="100" rx="10"/>
  <text x="299" y="178">第二级 A2</text>
  <line x1="414" y1="170" x2="461" y2="170"/>
  <path d="M461 164 L473 170 L461 176 Z" fill="currentColor"/>
  <rect x="473" y="120" width="120" height="100" rx="10"/>
  <text x="504" y="178">第三级</text>
  <text x="66" y="105" font-size="13">Ri1</text>
  <text x="270" y="105" font-size="13">Ri2 = 前级负载</text>
  <text x="482" y="105" font-size="13">Ri3</text>
  <text x="60" y="280">Au = Au1·Au2·Au3（倍数相乘）；后级 Ri 是前级负载，逐级带载连乘</text>
  <text x="60" y="312">输入电阻看第一级，输出电阻看末级；dB 口径逐级相加</text>
</svg>